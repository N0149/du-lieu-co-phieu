name: Auto Refresh Drive Snapshot

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.20.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run refresh snapshot script
        env:
          GOOGLE_DRIVE_API_KEY: AIzaSyB4PRAa88H_tqa8XcPfsZQBhujKrvuHQ9-4w
          GOOGLE_DRIVE_FOLDER_ID: 1eI8C_uDJlKDvNbzF9YOOr6QNCUIdw7o8
          REPORTS_SOURCE: live
        run: node scripts/refresh-snapshot.mjs

      - name: Commit & Push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports-snapshot.json
          git diff --staged --quiet || (git commit -m "chore: auto-refresh reports snapshot [skip ci]" && git push)