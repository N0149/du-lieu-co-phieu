name: Giám sát Công bố Thông tin & Tài liệu Doanh nghiệp (Cloud Định kỳ)

on:
  schedule:
    # --- CHẾ ĐỘ THƯỜNG NHẬT: QUÉT ĐA KHUNG GIỜ THEO PHIÊN GIAO DỊCH (THỨ 2 - THỨ 6) ---
    # 1. Đầu giờ sáng (08:30 VN = 01:30 UTC): Đón các tài liệu, thông tin ra sáng sớm hoặc đêm trước
    - cron: '30 1 * * 1-5'
    # 2. Nghỉ trưa (11:45 VN = 04:45 UTC): Đón các tài liệu công bố trong phiên sáng
    - cron: '45 4 * * 1-5'
    # 3. Giữa phiên chiều (14:15 VN = 07:15 UTC): Đón các tài liệu phát sinh trong phiên chiều
    - cron: '15 7 * * 1-5'
    # 4. Sau đóng cửa phiên (16:30 VN = 09:30 UTC): Khung giờ cao điểm công bố Nghị quyết HĐQT, giao dịch nội bộ
    - cron: '30 9 * * 1-5'
    # 5. Buổi tối (19:00 VN = 12:00 UTC): Quét tổng kết toàn bộ tài liệu công bố muộn trong ngày
    - cron: '0 12 * * 1-5'
    # --- CUỐI TUẦN (THỨ 7 & CHỦ NHẬT) ---
    # Quét 1 lần lúc 18:00 VN (11:00 UTC) để cập nhật tài liệu phát sinh cuối tuần
    - cron: '0 11 * * 0,6'

  workflow_dispatch:
    inputs:
      days:
        description: 'Số ngày nhìn lại (mặc định: 3 ngày)'
        required: false
        default: '3'
        type: string
      dry_run:
        description: 'Chỉ kiểm tra, không gửi tin Discord (true/false)'
        required: false
        default: 'false'
        type: string
      symbol:
        description: 'Quét riêng 1 mã cổ phiếu (để trống nếu quét toàn bộ)'
        required: false
        default: ''
        type: string

jobs:
  monitor-cbtt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4

      - name: Run CBTT Cloud Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.days }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --days=${{ github.event.inputs.days }}"
          else
            EXTRA_ARGS="$EXTRA_ARGS --days=3"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi

          if [ -n "${{ github.event.inputs.symbol }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --symbol=${{ github.event.inputs.symbol }}"
          fi

          echo "Chạy lệnh: python scripts/cbtt_monitor_cloud.py $EXTRA_ARGS"
          python scripts/cbtt_monitor_cloud.py $EXTRA_ARGS

      - name: Báo động nếu GitHub Actions gặp lỗi
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import os, urllib.request, json
          url = os.environ.get('DISCORD_WEBHOOK_URL')
          if url:
              payload = {
                  'content': '🚨 **BÁO ĐỘNG: GITHUB ACTIONS QUÉT CÔNG BỐ THÔNG TIN GẶP LỖI!**\nQuy trình quét tài liệu & công bố doanh nghiệp bị gián đoạn. Vui lòng kiểm tra log GitHub Actions!'
              }
              urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'}))
          "

      - name: Commit and push CBTT cache updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/cbtt_completed_cache.json data/cbtt_live_alerts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cbtt): auto sync cloud disclosures cache [skip ci]" && git push)
