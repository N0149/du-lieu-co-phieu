name: Giám sát Công bố Thông tin & Tài liệu Doanh nghiệp (Cloud Định kỳ)

on:
  schedule:
    # --- PHIÊN BAN NGÀY (THỨ 2 - THỨ 6): 1 TIẾNG / LẦN TỪ 08:30 ĐẾN 15:30 ---
    # 08:30 VN (01:30 UTC)
    - cron: '30 1 * * 1-5'
    # 09:30 VN (02:30 UTC)
    - cron: '30 2 * * 1-5'
    # 10:30 VN (03:30 UTC)
    - cron: '30 3 * * 1-5'
    # 11:30 VN (04:30 UTC)
    - cron: '30 4 * * 1-5'
    # 12:30 VN (05:30 UTC)
    - cron: '30 5 * * 1-5'
    # 13:30 VN (06:30 UTC)
    - cron: '30 6 * * 1-5'
    # 14:30 VN (07:30 UTC)
    - cron: '30 7 * * 1-5'
    # 15:30 VN (08:30 UTC)
    - cron: '30 8 * * 1-5'

    # --- BUỔI TỐI: QUÉT 2 LẦN LÚC 19:00 VÀ 21:30 ---
    # 19:00 VN (12:00 UTC)
    - cron: '0 12 * * *'
    # 21:30 VN (14:30 UTC)
    - cron: '30 14 * * *'

  workflow_dispatch:
    inputs:
      days:
        description: 'Số ngày nhìn lại (mặc định: 3 ngày)'
        required: false
        default: '3'
        type: string
      dry_run:
        description: 'Chỉ kiểm tra, không gửi tin Discord (true/false)'
        required: false
        default: 'false'
        type: string
      symbol:
        description: 'Quét riêng 1 mã cổ phiếu (để trống nếu quét toàn bộ)'
        required: false
        default: ''
        type: string

jobs:
  monitor-cbtt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4

      - name: Run CBTT Cloud Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.days }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --days=${{ github.event.inputs.days }}"
          else
            EXTRA_ARGS="$EXTRA_ARGS --days=3"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi

          if [ -n "${{ github.event.inputs.symbol }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --symbol=${{ github.event.inputs.symbol }}"
          fi

          echo "Chạy lệnh: python scripts/cbtt_monitor_cloud.py $EXTRA_ARGS"
          python scripts/cbtt_monitor_cloud.py $EXTRA_ARGS

      - name: Báo động nếu GitHub Actions gặp lỗi
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import os, urllib.request, json
          url = os.environ.get('DISCORD_WEBHOOK_URL')
          if url:
              payload = {
                  'content': '🚨 **BÁO ĐỘNG: GITHUB ACTIONS QUÉT CÔNG BỐ THÔNG TIN GẶP LỖI!**\nQuy trình quét tài liệu & công bố doanh nghiệp bị gián đoạn. Vui lòng kiểm tra log GitHub Actions!'
              }
              urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'}))
          "

      - name: Commit and push CBTT cache updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/cbtt_completed_cache.json data/cbtt_live_alerts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cbtt): auto sync cloud disclosures cache [skip ci]" && git push)
