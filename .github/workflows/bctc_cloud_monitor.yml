name: Giám sát BCTC 115 Mã (Cloud 10 Phút/Lần)

concurrency:
  group: bctc-cloud-monitor
  cancel-in-progress: false

on:
  schedule:
    # Ca 1: Phiên sáng khởi động lúc 08:20 sáng VN (01:20 UTC), chạy vòng lặp 10p/lần đến 11:30
    - cron: '20 1 * * *'
    # Dự phòng Ca 1 (nếu GitHub Actions quá tải bỏ lỡ mốc 08:20 thì mốc 08:35 sẽ tự động cứu)
    - cron: '35 1 * * *'
    # Ca 2: Phiên chiều khởi động lúc 13:00 chiều VN (06:00 UTC), chạy vòng lặp 10p/lần đến 15:30
    - cron: '0 6 * * *'
    # Dự phòng Ca 2 (nếu GitHub Actions quá tải bỏ lỡ mốc 13:00 thì mốc 13:15 sẽ kích hoạt)
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bỏ qua kiểm tra giờ (chạy ngay lập tức 1 lần)'
        required: false
        default: 'true'
        type: string

jobs:
  monitor-bctc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4

      - name: Run BCTC Cloud Monitor (Worker Loop 10 Phút/Lần)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/bctc_monitor_cloud.py --force
          else
            python scripts/bctc_monitor_cloud.py --loop
          fi

      - name: Báo động khẩn cấp nếu GitHub Actions bị lỗi
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import os, urllib.request, json
          url = os.environ.get('DISCORD_WEBHOOK_URL')
          if url:
              payload = {
                  'content': '🚨 **BÁO ĐỘNG KHẨN CẤP: MÁY CHỦ GITHUB ACTIONS GẶP LỖI!**\nQuy trình giám sát BCTC vừa bị gián đoạn hoặc dừng bất thường. Vui lòng kiểm tra ngay!'
              }
              urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'}))
          "

      - name: Commit and push BCTC cache updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/bctc_completed_cache.json data/bctc_q3_live_alerts.json data/bctc_cloud_status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bctc): auto sync cloud completed cache [skip ci]" && git push)


