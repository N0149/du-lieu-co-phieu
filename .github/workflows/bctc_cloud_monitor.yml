name: Giám sát BCTC 115 Mã (Cloud 10 Phút/Lần)

on:
  schedule:
    # Chạy đều đặn mỗi 10 phút một lần trong khung giờ hành chính (01:00 UTC -> 08:50 UTC, tức 08:00 sáng -> 15:50 chiều giờ VN)
    - cron: '*/10 1-8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bỏ qua kiểm tra giờ (chạy ngay lập tức)'
        required: false
        default: 'true'
        type: string

jobs:
  monitor-bctc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4

      - name: Run BCTC Cloud Monitor (115 Mã Nhóm 1)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/bctc_monitor_cloud.py --force
          else
            python scripts/bctc_monitor_cloud.py
          fi

      - name: Commit and push BCTC cache updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/bctc_completed_cache.json data/bctc_q3_live_alerts.json data/bctc_cloud_status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bctc): auto sync cloud completed cache [skip ci]" && git push)

