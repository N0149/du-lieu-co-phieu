name: Giám sát BCTC 115 Mã (Cloud 10 Phút/Lần)

on:
  schedule:
    # Chạy tự động mỗi 10 phút 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub bất cứ khi nào

jobs:
  monitor-bctc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4

      - name: Run BCTC Cloud Monitor (115 Mã Nhóm 1)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scripts/bctc_monitor_cloud.py

      - name: Commit and push BCTC cache updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/bctc_completed_cache.json data/bctc_q3_live_alerts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bctc): auto sync cloud completed cache [skip ci]" && git push)
