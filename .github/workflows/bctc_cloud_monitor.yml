name: Giám sát BCTC (Chế độ Thường nhật - Quét kiểm tra 1 lần/ngày)

on:
  schedule:
    # --- CHẾ ĐỘ THƯỜNG NHẬT (SAU MÙA BÁO CÁO TÀI CHÍNH) ---
    # Chỉ quét kiểm tra vét 1 lần/ngày vào buổi tối lúc 19:30 VN (12:30 UTC, Thứ 2 - Thứ 6)
    - cron: '30 12 * * 1-5'

  workflow_dispatch:
    inputs:
      force:
        description: 'Bỏ qua kiểm tra giờ (chạy ngay lập tức 1 lần)'
        required: false
        default: 'true'
        type: string

jobs:
  monitor-bctc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 pymupdf

      - name: Run BCTC Cloud Monitor (Rà soát thường nhật 1 lượt)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/bctc_monitor_cloud.py --force

      - name: Báo động khẩn cấp nếu GitHub Actions bị lỗi
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import os, urllib.request, json
          url = os.environ.get('DISCORD_WEBHOOK_URL')
          if url:
              payload = {
                  'content': '🚨 **BÁO ĐỘNG KHẨN CẤP: MÁY CHỦ GITHUB ACTIONS GẶP LỖI!**\nQuy trình giám sát BCTC vừa bị gián đoạn hoặc dừng bất thường. Vui lòng kiểm tra ngay!'
              }
              urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'}))
          "

      - name: Commit and push BCTC cache updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/bctc_completed_cache.json data/bctc_q3_live_alerts.json data/bctc_cloud_status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bctc): auto sync cloud completed cache [skip ci]" && git push)
