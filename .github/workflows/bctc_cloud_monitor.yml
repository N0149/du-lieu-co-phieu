name: Giám sát BCTC 115 Mã (Cloud 10 Phút/Lần)

on:
  schedule:
    # --- PHIÊN SÁNG & TRƯA (08:00 -> 13:00 VN, tức 01:00 -> 06:00 UTC, Thứ 2 - Thứ 6) ---
    # Mốc khởi động sớm 07:55 sáng VN (00:55 UTC) để đón đầu và chống kẹt hàng đợi
    - cron: '55 0 * * 1-5'
    # Mốc chuẩn: 08:00 sáng VN (01:00 UTC)
    - cron: '0 1 * * 1-5'
    # Các mốc cứu viện dự phòng ca sáng (nếu GitHub Actions bị delay/kẹt hàng đợi lúc 08:00):
    - cron: '15 1 * * 1-5' # 08:15 VN
    - cron: '30 1 * * 1-5' # 08:30 VN
    - cron: '0 2 * * 1-5'  # 09:00 VN
    - cron: '0 3 * * 1-5'  # 10:00 VN
    # Các mốc cứu viện dự phòng ca trưa (nếu ca sáng bị gián đoạn trước 11:30):
    - cron: '30 4 * * 1-5' # 11:30 VN (04:30 UTC - bắt đầu quét trưa 20p/lần)
    - cron: '0 5 * * 1-5'  # 12:00 VN (05:00 UTC)
    - cron: '30 5 * * 1-5' # 12:30 VN (05:30 UTC)

    # --- PHIÊN CHIỀU (13:00 -> 15:30 VN, tức 06:00 -> 08:30 UTC, Thứ 2 - Thứ 6) ---
    # Mốc khởi động sớm đón đầu ca chiều: 12:55 trưa VN (05:55 UTC)
    - cron: '55 5 * * 1-5' # 12:55 VN
    # Mốc chính: 13:00 chiều VN (06:00 UTC)
    - cron: '0 6 * * 1-5'
    # Các mốc cứu viện dự phòng ca chiều:
    - cron: '15 6 * * 1-5' # 13:15 VN
    - cron: '30 6 * * 1-5' # 13:30 VN
    - cron: '0 7 * * 1-5'  # 14:00 VN
    - cron: '30 7 * * 1-5' # 14:30 VN
  workflow_dispatch:
    inputs:
      force:
        description: 'Bỏ qua kiểm tra giờ (chạy ngay lập tức 1 lần)'
        required: false
        default: 'true'
        type: string

jobs:
  monitor-bctc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 pymupdf

      - name: Run BCTC Cloud Monitor (Worker Loop 10 Phút/Lần)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/bctc_monitor_cloud.py --force
          else
            python scripts/bctc_monitor_cloud.py --loop
          fi

      - name: Báo động khẩn cấp nếu GitHub Actions bị lỗi
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import os, urllib.request, json
          url = os.environ.get('DISCORD_WEBHOOK_URL')
          if url:
              payload = {
                  'content': '🚨 **BÁO ĐỘNG KHẨN CẤP: MÁY CHỦ GITHUB ACTIONS GẶP LỖI!**\nQuy trình giám sát BCTC vừa bị gián đoạn hoặc dừng bất thường. Vui lòng kiểm tra ngay!'
              }
              urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'}))
          "

      - name: Commit and push BCTC cache updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/bctc_completed_cache.json data/bctc_q3_live_alerts.json data/bctc_cloud_status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bctc): auto sync cloud completed cache [skip ci]" && git push)


