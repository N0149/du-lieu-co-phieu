name: Sync Market & Maritime Data Daily

on:
  schedule:
    # Chạy 1 lần mỗi ngày: 13:30 UTC (tức 20:30 GMT+7 tối theo giờ Việt Nam)
    - cron: '30 13 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest market & stock data
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          function fetchAndSave(url, dest) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                if (res.statusCode !== 200) {
                  return reject(new Error('Failed to fetch ' + url + ': ' + res.statusCode));
                }
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => {
                  fs.writeFileSync(dest, data);
                  console.log('Saved ' + dest);
                  resolve();
                });
              }).on('error', reject);
            });
          }

          async function main() {
            await fetchAndSave('https://longlivestock.com/data/indices.json', 'data/longlive_indices.json');
            await fetchAndSave('https://longlivestock.com/data/manifest.json', 'data/longlive_manifest.json');
            console.log('Market data sync done!');
          }
          main().catch(console.error);
          "

      - name: Scrape live maritime port calls & sync intelligence
        run: |
          python scripts/cangbien/run_pipeline.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/longlive_indices.json data/longlive_manifest.json data/maritime/dashboard_summary.json data/maritime/freight_rates.json data/maritime.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto sync market & maritime live schedules $(date +'%Y-%m-%d %H:%M')" && git push)
