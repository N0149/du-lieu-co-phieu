name: Sync Market & Maritime Data Daily

on:
  schedule:
    # 1. 09:30 UTC (16:30 chiều GMT+7, Thứ 2 - Thứ 6): Cập nhật giá & biến động 1W, 1M, 3M, YTD ngay sau ATC
    - cron: '30 9 * * 1-5'
    # 2. 11:00 UTC (18:00 chiều GMT+7 hàng ngày): Chốt ngày toàn diện & công bố thông tin
    - cron: '0 11 * * *'
    # 3. 23:00 UTC (06:00 sáng GMT+7 hàng ngày): Quét tin tức & chỉ số trước giờ mở cửa
    - cron: '0 23 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest market & stock data
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          function fetchAndSave(url, dest) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                if (res.statusCode !== 200) {
                  return reject(new Error('Failed to fetch ' + url + ': ' + res.statusCode));
                }
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => {
                  fs.writeFileSync(dest, data);
                  console.log('Saved ' + dest);
                  resolve();
                });
              }).on('error', reject);
            });
          }

          async function main() {
            await fetchAndSave('https://longlivestock.com/data/indices.json', 'data/longlive_indices.json');
            await fetchAndSave('https://longlivestock.com/data/manifest.json', 'data/longlive_manifest.json');
            console.log('Market data sync done!');
          }
          main().catch(console.error);
          "

      - name: Scrape live maritime port calls & sync intelligence
        run: |
          python scripts/cangbien/run_pipeline.py

      - name: Sync Corporate Disclosures (HOSE, HNX, UPCoM)
        continue-on-error: true
        run: |
          node scripts/sync-disclosures.mjs

      - name: Sync Stock Price Changes (1W, 1M, 3M, 6M, 1Y, 3Y, YTD for 1,530 tickers)
        continue-on-error: true
        run: |
          node scripts/sync-price-changes.mjs

      - name: Sync Valuation Metrics (P/E, P/B, Market Cap)
        continue-on-error: true
        run: |
          node scripts/crawl-direct-market.mjs --mode=valuation

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/longlive_indices.json data/longlive_manifest.json data/stock_price_changes.json data/evaluation_cache data/company_profiles.db data/maritime/dashboard_summary.json data/maritime/freight_rates.json data/maritime/national_traffic.json data/maritime/stocks_intel.json data/maritime.db data/disclosures_snapshot.json data/corporate_disclosures.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto sync market, price changes & disclosures $(date +'%Y-%m-%d %H:%M')" && git push)
