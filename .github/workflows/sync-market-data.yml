name: Sync Market Data Daily

on:
  schedule:
    # Chạy vào 08:45 UTC (15:45 Giờ Việt Nam GMT+7) từ Thứ 2 đến Thứ 6 hàng tuần
    - cron: '45 8 * * 1-5'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest market & stock data
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          function fetchAndSave(url, dest) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                if (res.statusCode !== 200) {
                  return reject(new Error('Failed to fetch ' + url + ': ' + res.statusCode));
                }
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => {
                  fs.writeFileSync(dest, data);
                  console.log('Saved ' + dest);
                  resolve();
                });
              }).on('error', reject);
            });
          }

          async function main() {
            await fetchAndSave('https://longlivestock.com/data/indices.json', 'data/longlive_indices.json');
            await fetchAndSave('https://longlivestock.com/data/manifest.json', 'data/longlive_manifest.json');
            console.log('Daily sync done!');
          }
          main().catch(console.error);
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/longlive_indices.json data/longlive_manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto sync market EOD data $(date +'%Y-%m-%d')" && git push)
